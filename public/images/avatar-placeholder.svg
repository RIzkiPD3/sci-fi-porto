<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="300" height="300" rx="12" fill="url(#grid)"/>
  
  <!-- Avatar circle -->
  <circle cx="150" cy="120" r="60" fill="none" stroke="url(#cyanGradient)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Head -->
  <circle cx="150" cy="100" r="25" fill="url(#cyanGradient)" opacity="0.3"/>
  
  <!-- Body -->
  <rect x="130" y="125" width="40" height="50" rx="20" fill="url(#cyanGradient)" opacity="0.2"/>
  
  <!-- Tech elements -->
  <circle cx="100" cy="80" r="3" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="80" r="3" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="80" cy="150" r="2" fill="#00bcd4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="220" cy="150" r="2" fill="#00bcd4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Connection lines -->
  <line x1="100" y1="80" x2="150" y2="100" stroke="#00ffff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="80" x2="150" y2="100" stroke="#00ffff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" begin="1s"/>
  </line>
  
  <!-- Bottom text -->
  <text x="150" y="220" text-anchor="middle" fill="#00ffff" font-family="monospace" font-size="14" opacity="0.8">
    AVATAR
  </text>
  <text x="150" y="240" text-anchor="middle" fill="#00bcd4" font-family="monospace" font-size="10" opacity="0.6">
    PLACEHOLDER
  </text>
</svg>

